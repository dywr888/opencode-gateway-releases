name: build-apk
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept licenses
        run: yes | sdkmanager --licenses || true
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -keyalg RSA -keysize 2048 \
            -validity 10000 -alias ocgw -dname "CN=OCGW" \
            -storepass android -keypass android
      - name: Build release APK
        env:
          KEYSTORE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: ocgw
          KEY_PASSWORD: android
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
