name: build-apk
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Configure preinstalled Android SDK
        # ubuntu-latest 预装 SDK 在 /usr/local/lib/android/sdk；直接指向，不用 setup-android action
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          ls /usr/local/lib/android/sdk/platforms || true
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -keyalg RSA -keysize 2048 \
            -validity 10000 -alias ocgw -dname "CN=OCGW" \
            -storepass android -keypass android
      - name: Set up Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Create gradle wrapper (AGP needs a project)
        run: |
          cat > build.gradle <<'EOF'
          // root build file intentionally empty
          EOF
      - name: Build release APK
        env:
          KEYSTORE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: ocgw
          KEY_PASSWORD: android
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
