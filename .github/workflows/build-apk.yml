name: build-apk
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
      - 'release.keystore'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          ls /usr/local/lib/android/sdk/platforms || true
      - name: Restore or create keystore
        run: |
          if [ -f release.keystore ]; then
            echo "Using keystore from repo"
          elif [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > release.keystore
            echo "Using keystore from secret"
          else
            echo "Creating new keystore (first time)"
            keytool -genkeypair -v -keystore release.keystore -keyalg RSA -keysize 2048 \
              -validity 10000 -alias ocgw -dname "CN=OCGW" \
              -storepass android -keypass android
          fi
      - name: Get version info
        id: version
        run: |
          VERSION="1.0.0"
          TAG="v${VERSION}-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/release.keystore" \
            -Pandroid.injected.signing.store.password="android" \
            -Pandroid.injected.signing.key.alias="ocgw" \
            -Pandroid.injected.signing.key.password="android"
      - name: Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "OpenCode Gateway ${{ steps.version.outputs.tag }}"
          body: |
            **OpenCode Gateway** for Android
            - Build: ${{ steps.version.outputs.tag }}
            - Commit: ${{ github.sha }}
            - **APK 镜像下载**：https://gh-proxy.com/https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/app-arm64-v8a-release.apk
            - 网关: 127.0.0.1:4318/v1
          files: |
            app/build/outputs/apk/release/*.apk
            release.keystore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
