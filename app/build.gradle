plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ocgw.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.ocgw.app"
        minSdk 24
        // 关键：targetSdk 必须 <= 28。
        // Android 10+ 对 targetSdk>=29 的 app 施加 W^X 限制，
        // 禁止执行 app 可写数据目录（filesDir）内的可执行文件，
        // 导致 proot / opencode 无法 exec。Termux 同样固定 targetSdk 28。
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a"
            universalApk false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        // targetSdk 28 会触发过期警告，构建时不阻断
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.12.0'
}
